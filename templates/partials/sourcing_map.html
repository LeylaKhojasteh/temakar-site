{% load site_tags %}
<section class="panel panel--navy sourcing" aria-labelledby="sourcing-title">
  <div class="shell">
    <div class="sourcing__head reveal">
      <h2 class="h2" id="sourcing-title">{% if is_fa %}مسیر تأمین{% else %}The supply route{% endif %}</h2>
      <p class="lead mt-4 max-w-[52ch] text-paper/80">
        {% if is_fa %}
          نقش ما پیدا کردن منبع درست و همراهی تا خرید است؛ از سازنده تا سایت شما.
        {% else %}
          Our role is to find the right source and stay with you until the purchase: from the maker to your site.
        {% endif %}
      </p>
    </div>

    <figure class="route reveal" data-route>
      <div class="route__frame">
        <svg class="route__scene" viewBox="0 0 1200 420" aria-hidden="true" focusable="false">
          <g class="route__line" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <path d="M20 360 H1180" opacity="0.4" />

            <path d="M78 360 V146 H262" />
            <path d="M78 200 L166 146" opacity="0.5" />
            <path d="M166 146 V262" opacity="0.5" />
            <rect x="146" y="262" width="40" height="26" opacity="0.85" />
            <path d="M166 262 V246" opacity="0.5" />

            <rect x="52" y="322" width="44" height="38" opacity="0.7" />
            <rect x="100" y="322" width="44" height="38" opacity="0.7" />
            <rect x="52" y="282" width="44" height="36" opacity="0.55" />
            <rect x="100" y="282" width="44" height="36" opacity="0.55" />

            <path d="M928 360 C 946 292 956 254 968 244 C 980 254 992 292 1010 360" />
            <path d="M944 312 H994" opacity="0.4" />
            <path d="M1038 360 V206 H1056 V360" />
            <path d="M1038 206 H1056" />
            <path d="M1078 360 V330" opacity="0.7" />
            <circle cx="1080" cy="316" r="16" opacity="0.7" />
            <path d="M884 330 H928" opacity="0.6" />
            <path d="M884 330 V300" opacity="0.6" />
          </g>

          <path id="route-a" class="route__path" d="M186 288 C 320 250 440 268 596 296"
                fill="none" stroke="var(--color-sky)" stroke-width="2" stroke-dasharray="8 10" />
          <path id="route-b" class="route__path" d="M604 296 C 720 320 820 312 906 322"
                fill="none" stroke="var(--color-sky)" stroke-width="2" stroke-dasharray="8 10" />

          <g class="route__nodes" fill="var(--color-sky)">
            <rect x="590" y="290" width="14" height="14" />
          </g>

          <circle class="route__pulse" r="5" fill="var(--color-paper)">
            <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.5;0.5;1" keyTimes="0;0.32;0.62;1" calcMode="linear">
              <mpath href="#route-full" />
            </animateMotion>
          </circle>
          <path id="route-full" d="M186 288 C 320 250 440 268 596 296 C 720 320 820 312 906 322"
                fill="none" stroke="none" />
        </svg>
      </div>

      <figcaption class="route__legend">
        <div class="route__item" data-stop="source" tabindex="0">
          <h3>{% if is_fa %}منبع{% else %}The source{% endif %}</h3>
          <p>
            {% if is_fa %}
              سازندگانی که سال‌ها با آن‌ها کار کرده‌ایم.
            {% else %}
              Manufacturers we have worked with for years.
            {% endif %}
          </p>
        </div>

        <div class="route__item" data-stop="middle" tabindex="0">
          <h3>{% if is_fa %}تماکار{% else %}Temakar{% endif %}</h3>
          <p>
            {% if is_fa %}
              نیاز را می‌خوانیم، منبع مناسب را انتخاب می‌کنیم و معرفی می‌کنیم.
            {% else %}
              We read the need, choose the right source and introduce it.
            {% endif %}
          </p>
        </div>

        <div class="route__item" data-stop="target" tabindex="0">
          <h3>{% if is_fa %}سایت شما{% else %}Your site{% endif %}</h3>
          <p>
            {% if is_fa %}
              نیروگاه، نفت و گاز، پتروشیمی و کارخانه‌های تولیدی.
            {% else %}
              Power plants, oil and gas, petrochemicals and manufacturing.
            {% endif %}
          </p>
        </div>
      </figcaption>
    </figure>
  </div>
</section>
