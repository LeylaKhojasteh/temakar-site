{% load static %}{% if img %}<img class="{{ class_name|default:'page-media__img' }}" src="{{ img.image.url }}" width="{{ img.image_width }}" height="{{ img.image_height }}" alt="{% if is_fa %}{{ img.alt_fa|default:img.alt_en }}{% else %}{{ img.alt_en|default:img.alt_fa }}{% endif %}" decoding="async"{% if priority %} fetchpriority="high"{% else %} loading="lazy"{% endif %}>{% else %}<img class="{{ class_name|default:'page-media__img' }}" src="{% static fallback %}" width="{{ fallback_w|default:1600 }}" height="{{ fallback_h|default:1000 }}" alt="{% if is_fa %}{{ fallback_alt }}{% else %}{{ fallback_alt_en|default:fallback_alt }}{% endif %}" decoding="async"{% if priority %} fetchpriority="high"{% else %} loading="lazy"{% endif %}>{% endif %}
