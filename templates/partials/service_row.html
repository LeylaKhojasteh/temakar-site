{% load site_tags %}
<a class="service-card reveal" href="{{ service.get_absolute_url }}">
  <span class="service-card__avatar">
    {% if service.image %}
      {% with thumb=service.image|variant:"thumb" %}
        {% if thumb %}
          <img src="{{ thumb.url }}" width="{{ thumb.width }}" height="{{ thumb.height }}"
               alt="" loading="lazy" decoding="async">
        {% else %}
          <img src="{{ service.image.url }}" width="{{ service.image_width }}" height="{{ service.image_height }}"
               alt="" loading="lazy" decoding="async">
        {% endif %}
      {% endwith %}
    {% else %}
      <span class="service-card__avatar-dot" aria-hidden="true"></span>
    {% endif %}
  </span>

  <span class="service-card__body">
    <span class="service-card__title">{% pick service "title" %}</span>
    {% pick service "summary" as summary %}
    {% if summary %}<span class="service-card__summary">{{ summary }}</span>{% endif %}
  </span>
</a>
