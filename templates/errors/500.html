{% extends "base.html" %}
{% load site_tags %}

{% block content %}
  <section class="panel panel--navy">
    <div class="shell error-page">
      <p class="error-code">500</p>
      <h1 class="page-title mt-6">{% tr "error.500.title" %}</h1>
      <p class="page-lead">{% tr "error.500.body" %}</p>
      <p class="mt-10 flex flex-wrap items-center gap-6">
        <a class="btn" href="{% url 'core:home' %}">{% tr "error.back_home" %}</a>
        <a class="text-link" href="{% url 'contact:page' %}">{% tr "cta.contact" %}</a>
      </p>
    </div>
  </section>
{% endblock %}
